<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Taller de Internet - Inicio</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-content">
      <a href="index.html" class="logo">Portal Taller de Internet</a>
      <nav id="authLinks">
        <a href="login.html" class="btn-login">Iniciar Sesion</a>
        <button id="darkModeToggle" class="btn-darkmode" onclick="toggleDarkMode()">🌙</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero-section">
      <h1>Bienvenido al Portal de Noticias</h1>
      <p>Las ultimas noticias de Desarrollo Web y Ciencia de Datos</p>
    </section>

    <section class="dolar-section">
      <h3>Cotizacion del Dolar</h3>
      <div id="dolarContainer">
        <p>Cargando...</p>
      </div>
    </section>

    <section>
      <h2 class="section-title">Ultimas Noticias</h2>
      <div id="noticiasContainer" class="noticias-grid">
        <p>Cargando noticias...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>2026 Portal Taller de Internet</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
