<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Taller de Internet - Login</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-content">
      <a href="index.html" class="logo">📰 Portal Taller de Internet</a>
      <nav>
        <a href="index.html">🏠 Volver al Inicio</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="login-container">
      <h2>Iniciar Sesión como Administrador</h2>
      <div id="errorMessage" class="error-message" style="display: none;"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" placeholder="Ej: emilys" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Ej: emilyspass" required>
        </div>
        
        <button type="submit" class="btn-primary">Iniciar Sesión</button>
      </form>
      
      <p style="text-align: center; margin-top: 1.5rem; color: #6b7280; font-size: 0.9rem;">
        Para pruebas puede usar: <strong>emilys</strong> / <strong>emilyspass</strong>
      </p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Portal Taller de Internet - Todos los derechos reservados</p>
  </footer>

  <script type="module">
    const API_BASE = 'https://dummyjson.com';
    const SESSION_KEY = 'session';

    document.addEventListener('DOMContentLoaded', () => {
      const session = getSession();
      if (session) {
        window.location.href = 'admin.html';
        return;
      }

      document.getElementById('loginForm').addEventListener('submit', handleLogin);
    });

    function getSession() {
      const session = localStorage.getItem(SESSION_KEY);
      return session ? JSON.parse(session) : null;
    }

    async function handleLogin(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      
      errorDiv.style.display = 'none';
      
      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        if (!response.ok) {
          throw new Error('Credenciales inválidas');
        }
        
        const data = await response.json();
        
        const sessionData = {
          username: data.username,
          email: data.email,
          token: data.token,
          isAdmin: true
        };
        
        localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
        
        window.location.href = 'admin.html';
        
      } catch (error) {
        errorDiv.textContent = error.message || 'Error al iniciar sesión';
        errorDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
